<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>許甫志工團</title>
<meta name="description" content="松山・信義廣告車巡迴路線與定點填班表入口">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;700&family=Noto+Sans+TC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    color-scheme: light;
    --bg:#F0F2EA;
    --surface:#FFFFFF;
    --surface-2:#E7EBDF;
    --ink:#1D2118;
    --ink-soft:#565F4C;
    --ink-faint:#8A9179;
    --line:#C3CAB4;
    --line-strong:#9FA88C;
    --cta:#2a5c4a;
    --cta-text:#F4F7F1;
    --radius-lg:22px;
    --shadow: 0 1px 2px rgba(29,33,24,0.06), 0 10px 28px -14px rgba(29,33,24,0.28);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme: dark;
      --bg:#14160F; --surface:#1B1E15; --surface-2:#242818;
      --ink:#ECEEE3; --ink-soft:#B7BEA6; --ink-faint:#7C8468;
      --line:#3A4030; --line-strong:#4E5740;
      --cta:#3FA080; --cta-text:#0E1410;
      --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 10px 28px -14px rgba(0,0,0,0.6);
    }
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --bg:#14160F; --surface:#1B1E15; --surface-2:#242818;
    --ink:#ECEEE3; --ink-soft:#B7BEA6; --ink-faint:#7C8468;
    --line:#3A4030; --line-strong:#4E5740;
    --cta:#3FA080; --cta-text:#0E1410;
    --shadow: 0 1px 2px rgba(0,0,0,0.4), 0 10px 28px -14px rgba(0,0,0,0.6);
  }

  *{box-sizing:border-box;}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;display:flex;align-items:center;justify-content:center;}
  .page{max-width:640px;width:100%;margin:0 auto;padding:32px 20px;}
  h1{font-family:'Noto Serif TC','Songti TC',serif;font-weight:700;margin:0;text-wrap:balance;}
  a{color:inherit;}

  header.hero{display:flex;flex-direction:column;gap:8px;margin-bottom:32px;text-align:center;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint);}
  header.hero h1{font-size:clamp(24px,4vw,32px);}

  .entry-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media (max-width:520px){ .entry-grid{grid-template-columns:1fr;} }

  .entry-card{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:28px 22px;text-decoration:none;color:var(--ink);transition:transform .15s ease, border-color .15s ease;}
  .entry-card:hover{border-color:var(--cta);transform:translateY(-2px);}
  .entry-icon{font-size:30px;}
  .entry-title{font-family:'Noto Serif TC',serif;font-weight:700;font-size:17px;}
  .entry-desc{font-size:13px;color:var(--ink-soft);line-height:1.6;}
  .entry-cta{margin-top:auto;font-size:13px;font-weight:600;color:var(--cta);display:inline-flex;align-items:center;gap:4px;}

  footer{margin-top:28px;font-size:12px;color:var(--ink-faint);text-align:center;}
</style>
</head>
<body>
<div class="page">

  <header class="hero">
    <span class="eyebrow">台北市 松山區・信義區</span>
    <h1>許甫志工團</h1>
  </header>

  <div class="entry-grid">
    <a class="entry-card" href="./大型活動.html">
      <span class="entry-icon">🎪</span>
      <span class="entry-title">大型活動</span>
      <span class="entry-desc">依活動地點查看排班日期，填入或取消登記姓名。</span>
      <span class="entry-cta">前往大型活動 →</span>
    </a>
    <a class="entry-card" href="./定點填班.html">
      <span class="entry-icon">📍</span>
      <span class="entry-title">定點路口</span>
      <span class="entry-desc">依地點查看排班日期，填入或取消登記姓名。</span>
      <span class="entry-cta">前往定點路口 →</span>
    </a>
    <a class="entry-card" href="./垃圾車路線.html">
      <span class="entry-icon">🚛</span>
      <span class="entry-title">垃圾車路線</span>
      <span class="entry-desc">依站點查看排班日期，填入或取消登記姓名。</span>
      <span class="entry-cta">前往垃圾車路線 →</span>
    </a>
    <a class="entry-card" href="./競總留守.html">
      <span class="entry-icon">🏢</span>
      <span class="entry-title">競總留守班表</span>
      <span class="entry-desc">查看每日競總留守班表。</span>
      <span class="entry-cta">前往競總留守班表 →</span>
    </a>
    <a class="entry-card" href="./路線地圖.html">
      <span class="entry-icon">🗺️</span>
      <span class="entry-title">松山信義宣傳車</span>
      <span class="entry-desc">查看每日巡迴路線地圖與班次填班表。</span>
      <span class="entry-cta">前往路線地圖 →</span>
    </a>

  </div>

  
</div>
</body>
</html>
