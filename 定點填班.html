<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>定點填班表 — 許甫志工團</title>
  <style>
    :root {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --card-border: #333333;
      --text: #e0e0e0;
      --text-muted: #a0a0a0;
      --primary: #0088cc;
      --primary-hover: #0077b3;
      --primary-alpha: rgba(0, 136, 204, 0.15);
      --danger: #d9534f;
      --danger-hover: #c9302c;
      --success: #5cb85c;
      --success-bg: rgba(92, 184, 92, 0.15);
      --error-bg: rgba(217, 83, 79, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 16px;
      max-width: 800px;
      margin: 0 auto;
    }

    .top-nav {
      margin-bottom: 12px;
    }

    .back-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 14px;
    }

    .back-link:hover {
      color: var(--text);
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .intro-text {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 16px;
    }

    /* Status Bar */
    .status-bar {
      padding: 10px 14px;
      border-radius: 8px;
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      font-size: 14px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-bar.ok {
      background-color: var(--success-bg);
      border-color: var(--success);
      color: #8ce98c;
    }

    .status-bar.err {
      background-color: var(--error-bg);
      border-color: var(--danger);
      color: #f88;
    }

    /* Search & Action Bar */
    .toolbar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .search-input {
      flex: 1;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--card-border);
      background-color: var(--card-bg);
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--primary);
    }

    .btn {
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn.primary {
      background-color: var(--primary);
      color: white;
    }

    .btn.primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn.ghost {
      background: transparent;
      color: var(--text-muted);
    }

    .btn.ghost:hover:not(:disabled) {
      color: var(--danger);
    }

    .btn.secondary {
      background-color: #333;
      color: var(--text);
    }

    .btn.secondary:hover:not(:disabled) {
      background-color: #444;
    }

    /* Cards & Accordion */
    .loc-card {
      background-color: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .loc-card summary {
      padding: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      user-select: none;
      list-style: none;
    }

    .loc-card summary::-webkit-details-marker {
      display: none;
    }

    .chev {
      font-size: 12px;
      margin-right: 10px;
      transition: transform 0.2s;
      color: var(--text-muted);
    }

    .loc-card[open] .chev {
      transform: rotate(90deg);
    }

    .loc-title-wrap {
      flex: 1;
    }

    .loc-title {
      font-weight: 600;
      font-size: 16px;
    }

    .loc-meta {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .loc-meta.has-today {
      color: #64b5f6;
    }

    .loc-body {
      padding: 0 14px 14px 14px;
      border-top: 1px solid var(--card-border);
    }

    /* Date Rows */
    .date-row {
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .date-row:last-child {
      border-bottom: none;
    }

    .date-row.is-today {
      background-color: var(--primary-alpha);
      margin: 8px -14px 0 -14px;
      padding: 12px 14px;
      border-radius: 6px;
    }

    .dr-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .dr-date {
      font-weight: 600;
      font-size: 14px;
    }

    .dr-time {
      font-size: 12px;
      color: var(--text-muted);
    }

    .today-badge {
      background-color: var(--primary);
      color: white;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }

    .dr-address {
      font-size: 12.5px;
      margin: -4px 0 8px;
    }

    .dr-address a {
      color: var(--primary);
      text-decoration: underline;
    }

    .dr-address a::after {
      content: ' ↗';
    }

    .dr-address a:hover {
      color: var(--primary-hover);
    }

    .dr-count {
      margin-left: auto;
      font-size: 12px;
      color: var(--text-muted);
    }

    .dr-count.full {
      color: #ff9800;
      font-weight: bold;
    }

    .name-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .claimed-name {
      background-color: #2a2a2a;
      border: 1px solid #444;
      padding: 4px 8px;
      border-radius: 16px;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .claimed-name button {
      padding: 0 4px;
      font-size: 14px;
      line-height: 1;
    }

    .btn.add {
      border-radius: 16px;
      padding: 4px 12px;
    }

    .empty-state {
      text-align: center;
      padding: 32px;
      color: var(--text-muted);
    }

    .footer-note {
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 24px;
      margin-bottom: 16px;
    }

    /* Modal Dialog */
    dialog {
      background-color: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      max-width: 400px;
      width: 90%;
      margin: auto;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    dialog::backdrop {
      background: rgba(0, 0, 0, 0.7);
    }

    .dialog-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .dialog-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid var(--card-border);
      background-color: #121212;
      color: var(--text);
      font-size: 15px;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--primary);
    }

    .dialog-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }
  </style>
</head>
<body>

  <div class="top-nav">
    <a href="./" class="back-link">← 回首頁</a>
  </div>

  <h1>定點路口</h1>
  <p class="intro-text">先找到地點，點開即可看到該地點的排班日期。每個日期最多 4 人，點「+ 填入姓名」登記，填錯可點姓名旁的 × 取消。</p>

  <div id="statusBar" class="status-bar">
    <span id="statusText">正在初始化…</span>
  </div>

  <div class="toolbar">
    <input type="text" id="locSearch" class="search-input" placeholder="搜尋地點名稱…">
    <button type="button" id="jumpToday" class="btn secondary" hidden>跳至今天</button>
  </div>

  <div id="locs"></div>

  <div class="footer-note">
    資料即時同步至 Google 試算表・多人共用同一連結
  </div>

  <!-- 填寫姓名對話框 -->
  <dialog id="fillDialog">
    <form id="fillForm" method="dialog">
      <div id="fillTitle" class="dialog-title">填入姓名</div>
      <div id="fillSub" class="dialog-sub"></div>
      <div class="form-group">
        <input type="text" id="fillName" class="form-input" placeholder="請輸入您的姓名/稱呼" required autocomplete="off">
      </div>
      <div class="dialog-actions">
        <button type="button" id="fillCancel" class="btn secondary">取消</button>
        <button type="submit" class="btn primary">確定送出</button>
      </div>
    </form>
  </dialog>

  <script>
    // ==== Google Apps Script 網頁應用程式 URL ====
    var API_URL = 'https://script.google.com/macros/s/AKfycbzMlU1JFPs0-dbhXBBsJXsyyuuiCp09DKaJLitV1QpNe9a0L1mR9Ub2s2tTGhd5xgrGDg/exec';
    // ==============================================

    var statusBar = document.getElementById('statusBar');
    var statusText = document.getElementById('statusText');
    var locsEl = document.getElementById('locs');
    var locSearch = document.getElementById('locSearch');
    var dialog = document.getElementById('fillDialog');
    var fillForm = document.getElementById('fillForm');
    var fillTitle = document.getElementById('fillTitle');
    var fillSub = document.getElementById('fillSub');
    var fillName = document.getElementById('fillName');
    var fillCancel = document.getElementById('fillCancel');
    var jumpTodayBtn = document.getElementById('jumpToday');

    var pendingRow = null; // {date, location}

    function todayIso(){
      var d = new Date();
      var m = String(d.getMonth()+1).padStart(2,'0');
      var day = String(d.getDate()).padStart(2,'0');
      return d.getFullYear() + '-' + m + '-' + day;
    }

    function setStatus(kind, text){
      statusBar.className = 'status-bar' + (kind ? ' ' + kind : '');
      statusText.textContent = text;
    }

    function groupByLocation(rows){
      var map = {}, order = [];
      rows.forEach(function(r){
        if (!map[r.location]) { 
          map[r.location] = { 
            location: r.location, 
            dates: [],
            minDate: r.date || ''
          }; 
          order.push(r.location); 
        }
        map[r.location].dates.push(r);
      });

      // 將 "9/7" 或 "2026-9-7" 中的單個數字補齊為雙位數 "09/07"，避免 ASCII/localeCompare 排序錯誤
      var toSortableDate = function(dStr) {
        if (!dStr) return '';
        return dStr.replace(/\d+/g, function(num) {
          return num.length === 1 ? '0' + num : num;
        });
      };

      var groups = order.map(function(loc){
        var g = map[loc];
        // 先對該地點內的所有日期排序
        g.dates.sort(function(a, b){ 
          return toSortableDate(a.date).localeCompare(toSortableDate(b.date)); 
        });
        
        // 確保 minDate 是該地點「最早」的那一個日期
        if (g.dates.length > 0) {
          g.minDate = g.dates[0].date || '';
        }
        return g;
      });

      // 依每個地點最早的排班日期排序（日期相同時再依地點名稱排序）
      groups.sort(function(a, b) {
        var dateA = toSortableDate(a.minDate);
        var dateB = toSortableDate(b.minDate);

        if (dateA !== dateB) return dateA.localeCompare(dateB);
        return a.location.localeCompare(b.location, 'zh-Hant');
      });

      return groups;
    }

    function render(rows){
      if (!rows.length) {
        locsEl.innerHTML = '<div class="empty-state">目前試算表中尚未建立任何排班列</div>';
        jumpTodayBtn.hidden = true;
        return;
      }
      var today = todayIso();
      var locs = groupByLocation(rows);

      locsEl.innerHTML = locs.map(function(loc){
        var filledTotal = 0, slotTotal = 0, hasToday = false;
        var singleDate = loc.dates.length === 1;
        var dateRows = loc.dates.map(function(s){
          var names = s.names || [];
          var filled = names.filter(function(n){ return n && String(n).trim(); });
          var count = filled.length;
          var full = count >= 4;
          filledTotal += count; slotTotal += 4;
          var isToday = s.date === today;
          if (isToday) hasToday = true;
          var chips = filled.map(function(n){
            return '<span class="claimed-name">' + escapeHtml(n) +
              '<button class="btn ghost" type="button" data-act="clear" data-date="' + s.date + '" data-location="' + escapeAttr(s.location) + '" data-name="' + escapeAttr(n) + '" aria-label="取消 ' + escapeAttr(n) + '">×</button></span>';
          }).join('');
          var addBtn = full ? '' :
            '<button class="btn primary add" type="button" data-act="fill" data-date="' + s.date + '" data-location="' + escapeAttr(s.location) + '" data-label="' + escapeAttr(s.dateLabel) + '">+ 填入姓名</button>';
          var timeHtml = (s.start && s.end) ? ('<span class="dr-time">' + s.start + '–' + s.end + '</span>') : '';
          var dateTimeHtml = singleDate ? '' : ('<span class="dr-date">' + escapeHtml(s.dateLabel) + '</span>' + timeHtml);
          var mapQuery = s.address || loc.location;
          var mapUrl = 'https://maps.google.com/?q=' + encodeURIComponent(mapQuery);
          var addressHtml = '<div class="dr-address"><a href="' + mapUrl + '" target="_blank" rel="noopener">📍 ' + escapeHtml(s.address || loc.location) + '</a></div>';
          return (
            '<div class="date-row' + (isToday ? ' is-today' : '') + '" id="row-' + escapeAttr(s.location) + '-' + s.date + '">' +
              '<div class="dr-head">' + dateTimeHtml + (isToday ? '<span class="today-badge">今天</span>' : '') +
                '<span class="dr-count' + (full ? ' full' : '') + '">' + count + '/4</span></div>' +
              addressHtml +
              '<div class="name-list">' + chips + addBtn + '</div>' +
            '</div>'
          );
        }).join('');

        var dateLabels = loc.dates.map(function(s){
          var t = (s.start && s.end) ? (' ' + s.start + '–' + s.end) : '';
          return s.dateLabel + t;
        }).join('、');
        var metaText = escapeHtml(dateLabels) + '・' + filledTotal + '/' + slotTotal + ' 已登記';
        return (
          '<details class="loc-card" id="loc-' + escapeAttr(loc.location) + '" data-loc-name="' + escapeAttr(loc.location) + '">' +
            '<summary>' +
              '<span class="chev">▶</span>' +
              '<span class="loc-title-wrap"><span class="loc-title">' + escapeHtml(loc.location) + '</span>' +
              '<div class="loc-meta' + (hasToday ? ' has-today' : '') + '">' + metaText + (hasToday ? '・含今天' : '') + '</div></span>' +
            '</summary>' +
            '<div class="loc-body">' + dateRows + '</div>' +
          '</details>'
        );
      }).join('');

      jumpTodayBtn.hidden = !hasAnyToday(rows, today);
    }

    function hasAnyToday(rows, today){
      return rows.some(function(r){ return r.date === today; });
    }

    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, function(c){
        return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
      });
    }
    function escapeAttr(s){ return escapeHtml(s); }

    var lastRows = [];
    var CACHE_KEY = 'fixedpoint_fillshift_cache_v2';

    function readCache(){
      try {
        var raw = localStorage.getItem(CACHE_KEY);
        if (!raw) return null;
        var parsed = JSON.parse(raw);
        if (!parsed || !Array.isArray(parsed.rows)) return null;
        return parsed;
      } catch (e) { return null; }
    }

    function writeCache(rows){
      try {
        localStorage.setItem(CACHE_KEY, JSON.stringify({ rows: rows, ts: Date.now() }));
      } catch (e) { /* ignore */ }
    }

    function applySearchFilter(){
      var q = locSearch.value.trim();
      var cards = locsEl.querySelectorAll('.loc-card');
      cards.forEach(function(card){
        var name = card.getAttribute('data-loc-name') || '';
        var match = !q || name.indexOf(q) !== -1;
        card.hidden = !match;
        if (match && q) card.open = true;
      });
    }

    locSearch.addEventListener('input', applySearchFilter);

    function jumpToToday(){
      var today = todayIso();
      var row = null;
      var rows = locsEl.querySelectorAll('.date-row.is-today');
      if (rows.length) row = rows[0];
      if (!row) return;
      var card = row.closest('.loc-card');
      if (card) card.open = true;
      row.scrollIntoView({ block:'center', behavior:'smooth' });
    }

    function loadData(){
      var cached = readCache();
      var slowTimer = null;

      if (cached) {
        lastRows = cached.rows;
        render(lastRows);
        setStatus('', '正在更新最新資料…');
      } else {
        setStatus('', '載入中…');
        slowTimer = setTimeout(function(){
          setStatus('', '連線 Google 試算表中，請再稍候…');
        }, 3000);
      }

      fetch(API_URL, { method:'GET' })
        .then(function(res){ return res.json(); })
        .then(function(data){
          if (slowTimer) clearTimeout(slowTimer);
          if (!data.ok) {
            if (cached) { setStatus('err', '更新失敗，目前顯示的是上次同步的資料'); return; }
            setStatus('err', '載入失敗：' + (data.error || '未知錯誤'));
            return;
          }
          var openLocs = Array.prototype.map.call(locsEl.querySelectorAll('.loc-card[open]'), function(c){ return c.getAttribute('data-loc-name'); });
          lastRows = data.rows;
          writeCache(lastRows);
          render(lastRows);
          applySearchFilter();
          openLocs.forEach(function(name){
            var card = locsEl.querySelector('.loc-card[data-loc-name="' + cssEscape(name) + '"]');
            if (card) card.open = true;
          });
          setStatus('ok', '已同步');
        })
        .catch(function(){
          if (slowTimer) clearTimeout(slowTimer);
          if (cached) { setStatus('err', '更新失敗，目前顯示的是上次同步的資料'); return; }
          setStatus('err', '無法連線至試算表，請確認網路連線或稍後再試');
        });
    }

    locsEl.addEventListener('click', function(e){
      var btn = e.target.closest('button[data-act]');
      if (!btn) return;
      e.preventDefault();
      var act = btn.getAttribute('data-act');
      if (act === 'fill') {
        pendingRow = { date: btn.getAttribute('data-date'), location: btn.getAttribute('data-location') };
        fillTitle.textContent = '填入姓名';
        fillSub.textContent = btn.getAttribute('data-label') + ' ・ ' + pendingRow.location;
        fillName.value = '';
        dialog.showModal();
        setTimeout(function(){ fillName.focus(); }, 50);
      } else if (act === 'clear') {
        var date = btn.getAttribute('data-date'), location = btn.getAttribute('data-location'), name = btn.getAttribute('data-name');
        if (!confirm('確定要取消「' + name + '」在 ' + date + ' ' + location + ' 的登記嗎？')) return;
        submitAction({ date:date, location:location, name:name, action:'clear' }, btn);
      }
    });

    fillCancel.addEventListener('click', function(){ dialog.close(); pendingRow = null; });

    fillForm.addEventListener('submit', function(e){
      e.preventDefault();
      var name = fillName.value.trim();
      if (!name) { fillName.focus(); return; }
      if (!pendingRow) { dialog.close(); return; }
      dialog.close();
      submitAction({ date: pendingRow.date, location: pendingRow.location, name: name, action:'fill' });
      pendingRow = null;
    });

    jumpTodayBtn.addEventListener('click', jumpToToday);

    function submitAction(payload, btnEl){
      if (btnEl) btnEl.disabled = true;
      setStatus('', '送出中…');
      fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      })
        .then(function(res){ return res.json(); })
        .then(function(data){
          if (btnEl) btnEl.disabled = false;
          if (!data.ok) {
            var msg = '操作失敗';
            if (data.error === 'full') msg = '這個定點已經額滿（4/4），畫面已更新';
            else if (data.error === 'name_mismatch') msg = '這筆登記不是這個姓名，無法取消';
            else if (data.error === 'busy_try_again') msg = '系統忙碌，請稍後再試一次';
            else if (data.error === 'not_found') msg = '找不到這個日期與地點的排班列，請確認試算表';
            else if (data.error === 'empty_name') msg = '請輸入姓名';
            else if (data.error) msg = '操作失敗：' + data.error;
            setStatus('err', msg);
            loadData();
            return;
          }
          lastRows = data.rows;
          writeCache(lastRows);
          var openLocs = Array.prototype.map.call(locsEl.querySelectorAll('.loc-card[open]'), function(c){ return c.getAttribute('data-loc-name'); });
          render(lastRows);
          applySearchFilter();
          openLocs.forEach(function(name){
            var card = locsEl.querySelector('.loc-card[data-loc-name="' + cssEscape(name) + '"]');
            if (card) card.open = true;
          });
          setStatus('ok', '已更新');
        })
        .catch(function(){
          if (btnEl) btnEl.disabled = false;
          setStatus('err', '網路異常，請稍後再試');
        });
    }

    function cssEscape(s){
      if (window.CSS && CSS.escape) return CSS.escape(s);
      return String(s).replace(/["\\]/g, '\\$&');
    }

    loadData();
  </script>
</body>
</html>
